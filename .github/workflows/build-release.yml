name: Build and Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows x64"
            os: windows-latest
            artifact_name: dbc2dbf-windows-x64.exe

          - name: "Windows ARM64"
            os: windows-11-arm
            artifact_name: dbc2dbf-windows-arm64.exe

          - name: "Linux x64"
            os: ubuntu-latest
            artifact_name: dbc2dbf-linux-x64

          - name: "Linux ARM64"
            os: ubuntu-24.04-arm
            artifact_name: dbc2dbf-linux-arm64

          - name: "macOS ARM64"
            os: macos-latest
            artifact_name: dbc2dbf-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv target/release/dbc2dbf.exe "${{ matrix.artifact_name }}"

      - name: Rename artifact (Unix)
        if: runner.os != 'Windows'
        run: mv target/release/dbc2dbf "${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          compression-level: 0
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: dbc2dbf-*
          path: dist
          merge-multiple: true

      - name: List downloaded files
        run: find dist -maxdepth 1 -type f | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
